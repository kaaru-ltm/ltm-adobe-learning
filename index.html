<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>AJO Journey + CBE Test</title>

<!-- Alloy Loader -->
<script>
!function(n,o){o.forEach(function(o){
  n[o]||( (n.__alloyNS=n.__alloyNS||[]).push(o),
  n[o]=function(){
    var u=arguments;
    return new Promise(function(i,l){
      n.setTimeout(function(){n[o].q.push([i,l,u])})
    })
  },
  n[o].q=[]
  )
})}(window,["alloy"]);
</script>

<script src="https://cdn1.adoberesources.net/alloy/2.19.1/alloy.js" async></script>

<style>
body{font-family:monospace;padding:20px;background:#111;color:#0f0}
h1{color:#0ff}
.step{margin:8px 0;padding:8px;border-left:3px solid #333}
.ok{border-color:#0f0}
.err{border-color:#f00}
.wait{border-color:#ff0}
.data{border-color:#0ff}
#hero-banner{margin-top:20px;padding:20px;border:2px solid #0ff;background:#000}
#result{margin-top:20px;padding:10px;white-space:pre-wrap;background:#000}
</style>
</head>

<body>

<h1>AJO Journey + Code-Based Experience</h1>

<div id="log"></div>

<!-- ✅ THIS MUST MATCH YOUR SURFACE -->
<div id="hero-banner">Waiting for personalized content...</div>

<div id="result">Waiting...</div>

<script>

// ✅ CONFIG
var CONFIG = {
  datastreamId: "9788be4b-6d69-444b-92e7-481021ea9c34", // change if needed
  orgId: "795D95DA5745973C7F000101@AdobeOrg",
  surface: "web://kaaru-ltm.github.io/ltm-adobe-learning/#hero-banner"
};

// ✅ TEST PROFILE
var cid = new URLSearchParams(window.location.search).get("cid") || "Prof-1001";

// ✅ LOGGING
function log(msg, cls){
  cls = cls || "step";
  var t = new Date().toLocaleTimeString();
  document.getElementById("log").innerHTML +=
    '<div class="step '+cls+'">['+t+'] '+msg+'</div>';
  console.log("[CBE]", msg);
}

// ✅ SHOW RAW RESPONSE
function showResult(data){
  document.getElementById("result").textContent =
    JSON.stringify(data, null, 2);
}

// ✅ RENDER CONTENT
function renderHero(content){
  var hero = document.getElementById("hero-banner");

  if(!content){
    hero.innerHTML = "No content returned";
    return;
  }

  hero.innerHTML =
    "<h2>"+(content.title || "")+"</h2>" +
    "<p>"+(content.greeting || "")+"</p>" +
    "<p>"+(content.message || "")+"</p>" +
    "<button>"+(content.cta || "Learn More")+"</button>";
}

// ✅ MAIN CALL (IMPORTANT - SINGLE CALL ONLY)
async function fetchCBE(){

  log("Fetching CBE content for "+cid,"wait");

  var resp = await alloy("sendEvent",{
    renderDecisions:false,
    personalization:{
      surfaces:[CONFIG.surface]
    },
    xdm:{
      eventType:"application.launch",
      timestamp:new Date().toISOString(),

      _mindtree_apac:{
        customerid:cid,
        eventType:"appOpen",
        channel:"web",
        timestamp:new Date().toISOString()
      },

      identityMap:{
        crmid:[{
          id:cid,
          authenticatedState:"authenticated",
          primary:true
        }]
      }
    }
  });

  console.log("Full Response:", resp);

  var props = (resp && resp.propositions) || [];

  log("Propositions received: "+props.length,"data");

  return {resp, props};
}

// ✅ TRACK DISPLAY (BEST PRACTICE)
async function trackDisplay(prop){
  if(!prop) return;

  await alloy("sendEvent",{
    xdm:{
      eventType:"decisioning.propositionDisplay",
      _experience:{
        decisioning:{
          propositions:[{
            id:prop.id,
            scope:prop.scope,
            scopeDetails:prop.scopeDetails
          }]
        }
      }
    }
  });

  log("Display tracked","ok");
}

// ✅ RUN FLOW
async function run(){
  try{

    log("Profile: "+cid,"data");
    log("Initializing Web SDK...","wait");

    await alloy("configure",{
      datastreamId:CONFIG.datastreamId,
      orgId:CONFIG.orgId,
      debugEnabled:true
    });

    log("SDK Configured","ok");

    // ✅ ONLY ONE CALL (Journey trigger + CBE fetch)
    var {resp, props} = await fetchCBE();

    // Retry logic
    if(props.length === 0){
      log("Retry after 5s","wait");
      await new Promise(r => setTimeout(r,5000));
      ({resp, props} = await fetchCBE());
    }

    if(props.length === 0){
      log("Retry after 10s","wait");
      await new Promise(r => setTimeout(r,10000));
      ({resp, props} = await fetchCBE());
    }

    if(props.length > 0){

      log("✅ SUCCESS - Content received","ok");

      var prop = props[0];
      var item = prop.items && prop.items[0];
      var content = item && item.data && item.data.content;

      // parse string JSON if needed
      if(typeof content === "string"){
        try{ content = JSON.parse(content); }catch(e){}
      }

      renderHero(content);
      showResult(resp);

      await trackDisplay(prop);

    } else {
      log("❌ No content found","err");
      showResult(resp);
    }

  }catch(e){
    log("ERROR: "+e.message,"err");
    console.error(e);
  }
}

window.addEventListener("load", run);

</script>

</body>
</html>
``
