<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #d4af37}
.header h1{font-size:20px;color:#d4af37}
.header .logo{font-weight:bold;color:#fff;font-size:14px}
.warning-bar{background:rgba(243,156,18,0.1);border-bottom:1px solid rgba(243,156,18,0.3);padding:8px 24px;display:flex;align-items:center;gap:8px}
.warning-bar span{color:#f39c12;font-size:12px}
.quick-links{background:#111;padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #222}
.quick-links span{color:#666;font-size:11px}
.quick-links a{color:#d4af37;font-size:11px;text-decoration:none;padding:4px 12px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);border-radius:4px;transition:all 0.2s}
.quick-links a:hover{background:rgba(212,175,55,0.2)}
.quick-links a.active-link{background:#d4af37;color:#1a1a2e;font-weight:bold}
.persona-bar{background:#16213e;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #333}
.persona-bar label{color:#aaa;font-size:13px}
.persona-bar select{background:#1a1a2e;color:#d4af37;border:1px solid #d4af37;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;max-width:420px}
.persona-bar .status{margin-left:auto;font-size:12px;color:#666;padding:6px 12px;border-radius:20px;background:#111}
.persona-bar .status.connected{color:#2ecc71;border:1px solid #2ecc71}
.persona-bar .status.loading{color:#f39c12;border:1px solid #f39c12}
.persona-bar .status.error{color:#e74c3c;border:1px solid #e74c3c}
.profile-card{background:#111;border:1px solid #222;border-radius:8px;padding:16px 24px;margin:16px auto;max-width:960px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.profile-card .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#d4af37,#b8860b);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#1a1a2e}
.profile-card .info h3{color:#d4af37;font-size:16px;margin-bottom:4px}
.profile-card .info p{color:#888;font-size:12px}
.profile-card .tags{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.profile-card .tag{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid #333;color:#aaa}
.profile-card .tag.gold{border-color:#d4af37;color:#d4af37}
.profile-card .tag.silver{border-color:#c0c0c0;color:#c0c0c0}
.profile-card .tag.active{border-color:#2ecc71;color:#2ecc71}
.profile-card .tag.inactive{border-color:#e74c3c;color:#e74c3c}
.page{max-width:960px;margin:0 auto;padding:0 24px 24px}
.welcome-card{background:linear-gradient(135deg,#16213e,#1a1a2e);border:1px solid #333;border-radius:12px;padding:24px;margin-bottom:24px}
.welcome-card h2{color:#d4af37;margin-bottom:8px}
.welcome-card p{color:#aaa;font-size:14px}
#hero-banner{padding:0;border:2px dashed #333;border-radius:16px;min-height:200px;display:flex;align-items:center;justify-content:center;background:#111;color:#666;font-size:16px;transition:all 0.5s ease;overflow:hidden}
.offer-card{width:100%;padding:32px;background:linear-gradient(135deg,#1a1a2e 0%,#0d1b2a 50%,#1b2a4a 100%);border-radius:14px;text-align:center;position:relative;overflow:hidden}
.offer-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(212,175,55,0.05) 0%,transparent 70%);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%,100%{transform:rotate(0deg)}50%{transform:rotate(180deg)}}
.offer-card .badge{display:inline-block;background:linear-gradient(135deg,#d4af37,#b8860b);color:#1a1a2e;font-weight:bold;font-size:11px;padding:4px 16px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.offer-card h2{color:#d4af37;font-size:22px;margin-bottom:8px;position:relative}
.offer-card .greeting{color:#8ecae6;font-size:15px;margin-bottom:16px}
.offer-message-box{background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.2);border-radius:10px;padding:20px;margin:16px 0;position:relative}
.offer-message-box p{color:#e0e0e0;font-size:15px;line-height:1.6}
.offer-meta{display:flex;justify-content:center;gap:16px;margin:16px 0;flex-wrap:wrap}
.offer-meta span{font-size:11px;color:#888;padding:4px 10px;background:rgba(255,255,255,0.05);border-radius:6px}
.offer-meta span b{color:#d4af37}
.offer-actions{display:flex;justify-content:center;gap:12px;margin-top:20px}
.btn-learn{background:linear-gradient(135deg,#d4af37,#b8860b);color:#1a1a2e;font-weight:bold;font-size:14px;padding:12px 32px;border:none;border-radius:8px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
.btn-learn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(212,175,55,0.4)}
.btn-close{background:transparent;color:#d4af37;font-size:14px;padding:12px 32px;border:1px solid rgba(212,175,55,0.4);border-radius:8px;cursor:pointer;transition:all 0.2s}
.btn-close:hover{border-color:#d4af37;background:rgba(212,175,55,0.1)}
.offer-brand{color:#555;font-size:12px;margin-top:16px}
.no-offer{text-align:center;padding:40px}
.no-offer h3{color:#555;margin-bottom:8px}
.no-offer p{color:#444;font-size:13px}
.console-panel{margin-top:24px;background:#0d0d0d;border:1px solid #222;border-radius:12px;max-height:300px;overflow-y:auto}
.console-header{padding:10px 16px;background:#1a1a1a;border-bottom:1px solid #222;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center}
.console-header span{color:#d4af37;font-size:13px;font-weight:bold}
.console-header button{background:#333;color:#aaa;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px}
#console-log{padding:12px 16px;font-family:'Courier New',monospace;font-size:11px}
.log-entry{margin-bottom:4px;padding:2px 0;border-bottom:1px solid #111}
.log-info{color:#8ecae6}
.log-success{color:#2ecc71}
.log-warn{color:#f39c12}
.log-error{color:#e74c3c}
.log-data{color:#bb86fc}
</style>
