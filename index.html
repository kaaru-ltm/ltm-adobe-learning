<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Simple CBE Test</title>
<script>
!function(n,o){o.forEach(function(o){n[o]||((n.__alloyNS=n.__alloyNS||[]).push(o),n[o]=function(){var u=arguments;return new Promise(function(i,l){n.setTimeout(function(){n[o].q.push([i,l,u])})})},n[o].q=[])})}(window,["alloy"]);
</script>
<script src="https://cdn1.adoberesources.net/alloy/2.19.1/alloy.js" async></script>
<style>
body{font-family:monospace;padding:20px;background:#111;color:#0f0;font-size:14px}
h1{color:#0ff;font-size:18px}
.step{margin:8px 0;padding:8px;border-left:3px solid #333}
.ok{border-color:#0f0;color:#0f0}
.wait{border-color:#ff0;color:#ff0}
.err{border-color:#f00;color:#f00}
.data{border-color:#0ff;color:#0ff}
#result{margin-top:20px;padding:16px;background:#000;border:2px solid #0ff;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;max-height:400px;overflow-y:auto}
</style>
</head>
<body>
<h1>AJO Journey + Code-Based Experience Test</h1>
<div id="log"></div>
<div id="result">Waiting...</div>

<script>
var CONFIG={
  datastreamId:"77321020-af6b-46a7-b26a-7da24e35ecdb",
  orgId:"795D95DA5745973C7F000101@AdobeOrg",
  surface:"web://kaaru-ltm.github.io/ltm-adobe-learning/#hero-banner"
};

var cid=new URLSearchParams(window.location.search).get("cid")||"Prof-9903";

function log(msg,cls){
  cls=cls||"step";
  var d=document.getElementById("log");
  var t=new Date().toLocaleTimeString();
  d.innerHTML+='<div class="step '+cls+'">['+t+'] '+msg+'</div>';
  console.log("[CBE] "+msg);
}

function showResult(data){
  document.getElementById("result").textContent=JSON.stringify(data,null,2);
}

function wait(ms){return new Promise(function(r){setTimeout(r,ms)});}

async function triggerJourney(){
  log("STEP 1: Triggering Journey - appOpen for "+cid,"wait");
  var resp=await alloy("sendEvent",{
    renderDecisions:false,
    xdm:{
      eventType:"application.launch",
      timestamp:new Date().toISOString(),
      _mindtree_apac:{
        customerid:cid,
        eventType:"appOpen",
        channel:"web",
        timestamp:new Date().toISOString()
      },
      identityMap:{
        crmId:[{id:cid,authenticatedState:"authenticated",primary:true}]
      }
    }
  });
  log("Journey triggered!","ok");
  console.log("Call 1 response:",resp);
  return resp;
}

async function fetchContent(){
  log("Fetching personalization for surface...","wait");
  var resp=await alloy("sendEvent",{
    renderDecisions:false,
    personalization:{surfaces:[CONFIG.surface]},
    xdm:{
      eventType:"decisioning.propositionFetch",
      timestamp:new Date().toISOString(),
      identityMap:{
        crmId:[{id:cid,authenticatedState:"authenticated",primary:true}]
      }
    }
  });
  var props=(resp&&resp.propositions)||[];
  log("Got "+props.length+" proposition(s)","data");
  console.log("Call 2 response:",resp);
  return resp;
}

async function run(){
  try{
    log("Profile: "+cid,"data");
    log("Datastream: "+CONFIG.datastreamId,"data");
    log("Surface: "+CONFIG.surface,"data");
    log("Configuring Web SDK...","wait");

    await alloy("configure",{
      datastreamId:CONFIG.datastreamId,
      orgId:CONFIG.orgId,
      debugEnabled:true
    });
    log("Web SDK configured!","ok");

    await triggerJourney();

    log("Waiting 5 seconds for Journey to process...","wait");
    await wait(5000);

    var resp=await fetchContent();
    var props=(resp&&resp.propositions)||[];

    if(props.length===0){
      log("Empty - Retry 1: Waiting 5 more seconds...","wait");
      await wait(5000);
      resp=await fetchContent();
      props=(resp&&resp.propositions)||[];
    }

    if(props.length===0){
      log("Empty - Retry 2: Waiting 10 more seconds...","wait");
      await wait(10000);
      resp=await fetchContent();
      props=(resp&&resp.propositions)||[];
    }

    if(props.length>0){
      log("SUCCESS! CBE content received!","ok");
      var item=props[0]&&props[0].items&&props[0].items[0];
      var content=item&&item.data&&item.data.content;
      if(typeof content==="string"){
        try{content=JSON.parse(content);}catch(e){}
      }
      showResult({propositions:props,parsedContent:content});
      log("Content: "+JSON.stringify(content),"ok");
    }else{
      log("No content after 3 attempts. Check Journey Live View.","err");
      showResult({propositions:[],message:"No content returned after 3 retries"});
    }
  }catch(e){
    log("ERROR: "+e.message,"err");
    showResult({error:e.message});
  }
}

window.addEventListener("load",run);
</script>
</body>
</html>
